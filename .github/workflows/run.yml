name: Run Service

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: run-group
  cancel-in-progress: false

env:
  UPLOAD_API_TOKEN: ${{ secrets.UPLOAD_API_TOKEN }}
  GH_OWNER: ${{ github.repository_owner }}
  GH_REPO: ${{ github.event.repository.name }}
  RUN_DURATION: 19800

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Restore DB from private git repo
        run: |
          git clone https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git db-repo || mkdir db-repo
          mkdir -p data
          if [ -f db-repo/data.zip ]; then
            unzip -o db-repo/data.zip -d .
            rm -rf data/logs data/bin
            echo "DB and data restored from zip."
          else
            echo "Fresh start"
          fi

      - name: Download & extract 9router CLI
        env:
          GHCP_TOKEN: ${{ secrets.GHCP_TOKEN }}
        run: |
          echo "Resolving 9router CLI release asset (tag cli-latest-opt)..."
          ASSET_ID=$(curl -sf --retry 3 \
            -H "Authorization: bearer $GHCP_TOKEN" \
            https://api.github.com/repos/jjjjllll111/9router-private/releases/tags/cli-latest-opt \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['assets'][0]['id'])")
          echo "Downloading 9router-cli.tar.gz (asset $ASSET_ID, tag cli-latest-opt)..."
          curl -fL --retry 3 \
            -H "Authorization: bearer $GHCP_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/jjjjllll111/9router-private/releases/assets/$ASSET_ID" \
            -o 9router-cli.tar.gz
          mkdir -p 9router-app
          tar -xzf 9router-cli.tar.gz -C 9router-app
          shopt -s dotglob
          entries=( 9router-app/* )
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* 9router-app/
            rmdir "${entries[0]}"
          fi
          printf '%s\n' \
            '{' \
            '  "name": "9router",' \
            '  "version": "0.5.50",' \
            '  "dependencies": { "node-machine-id": "^1.1.12" }' \
            '}' > 9router-app/package.json
          (cd 9router-app && npm install --omit=dev --ignore-scripts --no-audit --no-fund)
          ls -la 9router-app

      - name: Start service
        id: start
        working-directory: 9router-app
        run: |
          export DATA_DIR="$GITHUB_WORKSPACE/data" PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
          mkdir -p "$DATA_DIR"
          echo "Starting 9router with node..."
          nohup node cli.js --no-browser --skip-update --tray --port 20128 --host 0.0.0.0 > "$GITHUB_WORKSPACE/9router.log" 2>&1 &
          APP_PID=$!
          echo "pid=$APP_PID" >> $GITHUB_OUTPUT
          sleep 3
          for i in $(seq 1 10); do
            curl -sf http://localhost:20128 > /dev/null 2>&1 && echo "Service ready!" && break
            sleep 2
          done

      - name: Setup Cloudflare Tunnel
        id: cloudflare
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
          echo "$!" > /tmp/cloudflared.pid
          sleep 5
          echo "Tunnel started"

      - name: Verify connectivity
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' "http://localhost:20128/" --max-time 10 2>/dev/null || true)
            echo "Local check $i: HTTP $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ] 2>/dev/null; then
              echo "Service accessible!"
              exit 0
            fi
            sleep 5
          done
          echo "Service failed to become accessible after 6 attempts!"
          echo "=== 9router.log tail ==="
          tail -n 60 "$GITHUB_WORKSPACE/9router.log" 2>/dev/null || true
          echo "========================"
          exit 1

      - name: Keep alive + watchdog
        run: |
          checkpoint_sqlite() {
            for db in data/db/*.sqlite data/db/*.db data/*.sqlite data/*.db; do
              [ -f "$db" ] || continue
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 "$db" "PRAGMA wal_checkpoint(TRUNCATE);" 2>/dev/null || true
              else
                python3 -c "import sqlite3,sys; con=sqlite3.connect(sys.argv[1]); con.execute('PRAGMA wal_checkpoint(TRUNCATE)'); con.close()" "$db" 2>/dev/null || true
              fi
            done
          }

          git_push_with_retry() {
            local msg="$1"
            (
              cd db-repo
              if [ ! -d .git ]; then
                git init -q
                git remote add origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git
              else
                git remote set-url origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git 2>/dev/null || git remote add origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git fetch origin main 2>/dev/null || true
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                git checkout -B main origin/main 2>/dev/null || git checkout -b main
              else
                git checkout --orphan main 2>/dev/null || git checkout -b main
              fi
              git add data.zip
              git commit -m "$msg" --allow-empty || true
              for i in 1 2 3; do
                if git push origin main; then
                  echo "push ok"
                  break
                fi
                echo "push failed retry $i"
                sleep $((i*2))
                git fetch origin main || true
                # keep our data.zip on top of latest
                git rebase origin/main 2>/dev/null || git reset --hard origin/main || true
                git add data.zip 2>/dev/null || true
                git commit -m "$msg retry $i" --allow-empty 2>/dev/null || true
                if [ "$i" -eq 3 ]; then
                  echo "push failed after retries"
                  exit 1
                fi
              done
            )
          }

          upload_db() {
            echo "[$(date)] DB upload..."
            checkpoint_sqlite
            mkdir -p db-repo
            rm -f db-repo/data.zip
            zip -r db-repo/data.zip data/ -x "data/logs/*" "data/bin/*" >/dev/null
            git_push_with_retry "backup $(date -u +%Y%m%d%H%M%S)"
          }

          END=$((SECONDS + ${{ env.RUN_DURATION }}))
          LAST_UPLOAD=0
          while [ $SECONDS -lt $END ]; do
            NOW=$(date +%s)
            CF_PID=$(cat /tmp/cloudflared.pid 2>/dev/null || echo 0)
            if [ "$CF_PID" -gt 0 ] && ! kill -0 $CF_PID 2>/dev/null; then
              echo "[$(date)] cloudflared died, restarting..."
              nohup cloudflared tunnel --no-autoupdate run --token ${{ secrets.CF_TUNNEL_TOKEN }} > /dev/null 2>&1 &
              echo "$!" > /tmp/cloudflared.pid
              sleep 3
            fi
            if ! curl -s http://localhost:20128 > /dev/null 2>&1; then
              echo "[$(date)] Service died or unresponsive, restarting..."
              echo "=== 9router Log ==="
              cat 9router.log 2>/dev/null || true
              echo "==================="
              export DATA_DIR="$GITHUB_WORKSPACE/data" PORT=20128 HOSTNAME=0.0.0.0 NODE_ENV=production
              (cd "$GITHUB_WORKSPACE/9router-app" && nohup node cli.js --no-browser --skip-update --tray --port 20128 --host 0.0.0.0 > "$GITHUB_WORKSPACE/9router.log" 2>&1 &)
              sleep 5
            fi
            if [ $((NOW - LAST_UPLOAD)) -ge 600 ]; then
              upload_db
              LAST_UPLOAD=$NOW
            fi
            REMAINING=$((END - SECONDS))
            echo "[$(date)] Remaining: $((REMAINING/3600))h $(((REMAINING%3600)/60))m"
            sleep 30
          done

      - name: Final upload
        if: always()
        run: |
          kill ${{ steps.start.outputs.pid }} 2>/dev/null || true
          sleep 2
          for db in data/db/*.sqlite data/db/*.db data/*.sqlite data/*.db; do
            [ -f "$db" ] || continue
            if command -v sqlite3 >/dev/null 2>&1; then
              sqlite3 "$db" "PRAGMA wal_checkpoint(TRUNCATE);" 2>/dev/null || true
            else
              python3 -c "import sqlite3,sys; con=sqlite3.connect(sys.argv[1]); con.execute('PRAGMA wal_checkpoint(TRUNCATE)'); con.close()" "$db" 2>/dev/null || true
            fi
          done
          mkdir -p db-repo
          rm -f db-repo/data.zip
          zip -r db-repo/data.zip data/ -x "data/logs/*" "data/bin/*" >/dev/null
          (
            cd db-repo
            if [ ! -d .git ]; then
              git init -q
              git remote add origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git
            else
              git remote set-url origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git 2>/dev/null || git remote add origin https://x-access-token:${{ secrets.UPLOAD_API_TOKEN }}@github.com/stephaniekellybje/db.git
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main 2>/dev/null || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              git checkout -B main origin/main 2>/dev/null || git checkout -b main
            else
              git checkout --orphan main 2>/dev/null || git checkout -b main
            fi
            git add data.zip
            git commit -m "final backup $(date -u +%Y%m%d%H%M%S)" --allow-empty || true
            for i in 1 2 3; do
              if git push origin main; then break; fi
              echo "final push retry $i"
              sleep $((i*2))
              git fetch origin main || true
              git rebase origin/main 2>/dev/null || git reset --hard origin/main || true
              git add data.zip 2>/dev/null || true
              git commit -m "final backup retry $i $(date -u +%Y%m%d%H%M%S)" --allow-empty 2>/dev/null || true
            done
          )
          echo "=== Done ==="
